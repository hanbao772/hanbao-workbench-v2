<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="汉堡的万能助手">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#38bdf8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>汉堡的万能助手 🍔</title>
<style>
/* ============ 全局样式 ============ */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --sky-50:#eff6ff; --sky-100:#dbeafe; --sky-200:#bfdbfe; --sky-300:#93c5fd;
  --sky-400:#38bdf8; --sky-500:#0ea5e9; --sky-600:#0284c7;
  --rose-50:#f0f9ff; --rose-100:#e0f2fe; --rose-300:#7dd3fc;
  --text-main:#1e3a52; --text-soft:#5b7e96; --text-light:#9bb8cc;
  --white:#fff; --shadow:0 4px 20px rgba(56,189,248,.14);
  --shadow-lg:0 8px 30px rgba(56,189,248,.20);
  --radius:16px; --radius-sm:10px;
}
body{
  font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  background:linear-gradient(135deg,#eff6ff 0%,#e0f2fe 50%,#eff6ff 100%);
  color:var(--text-main); min-height:100vh; display:flex;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--sky-50);}
::-webkit-scrollbar-thumb{background:var(--sky-200);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--sky-300);}

/* ============ 左侧导航栏 ============ */
.sidebar{
  width:220px; min-height:100vh; background:rgba(255,255,255,.75);
  backdrop-filter:blur(20px); border-right:1px solid var(--sky-100);
  display:flex; flex-direction:column; padding:18px 0; position:fixed;
  left:0; top:0; z-index:100; box-shadow:2px 0 20px rgba(56,189,248,.06);
}
.logo{
  text-align:center; padding:8px 20px 18px; border-bottom:2px dashed var(--sky-100);
  margin-bottom:10px;
}
.logo-icon{font-size:36px; display:block; margin-bottom:6px;}
.logo-title{font-size:18px; font-weight:700; color:var(--sky-600); letter-spacing:1px;}
.logo-sub{font-size:11px; color:var(--text-light); margin-top:2px;}

.nav-list{flex:1; overflow-y:auto; padding:0 12px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:4px;
  border-radius:var(--radius-sm); cursor:pointer; transition:all .25s ease;
  color:var(--text-soft); font-size:14px; font-weight:500; position:relative;
}
.nav-item:hover{background:var(--sky-50); color:var(--sky-500); transform:translateX(3px);}
.nav-item.active{
  background:linear-gradient(135deg,var(--sky-100),var(--rose-100));
  color:var(--sky-600); font-weight:600; box-shadow:var(--shadow);
}
.nav-item.active::before{
  content:''; position:absolute; left:-12px; top:50%; transform:translateY(-50%);
  width:4px; height:24px; background:var(--sky-400); border-radius:0 4px 4px 0;
}
.nav-icon{font-size:20px; width:28px; text-align:center; flex-shrink:0;}
.nav-badge{
  margin-left:auto; font-size:10px; background:var(--sky-400); color:#fff;
  padding:2px 7px; border-radius:10px; min-width:20px; text-align:center;
}

/* ============ 主内容区 ============ */
.main{margin-left:220px; flex:1; padding:24px 32px; min-height:100vh;}

/* === 顶部桌面区域 === */
.dashboard{
  display:grid; grid-template-columns:1fr 1fr 1.2fr; gap:20px; margin-bottom:24px;
}
.card{
  background:rgba(255,255,255,.8); backdrop-filter:blur(10px); border-radius:var(--radius);
  padding:24px; box-shadow:var(--shadow); border:1px solid rgba(191,219,254,.5);
  transition:transform .3s, box-shadow .3s;
}
.card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
.card-title{font-size:13px; color:var(--text-soft); margin-bottom:12px; display:flex; align-items:center; gap:6px;}

/* 时间卡片 */
.time-card{
  background:linear-gradient(135deg,var(--sky-400),var(--sky-500));
  color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center;
  position:relative; overflow:hidden;
}
.time-card::before{content:'🍔'; position:absolute; top:-10px; right:-5px; font-size:60px; opacity:.15;}
.time-card::after{content:'🌊'; position:absolute; bottom:-15px; left:-5px; font-size:50px; opacity:.15;}
.clock{font-size:42px; font-weight:700; letter-spacing:2px; font-variant-numeric:tabular-nums;}
.date{font-size:14px; margin-top:6px; opacity:.95;}
.weekday{font-size:12px; margin-top:4px; opacity:.8;}

/* 打卡卡片 */
.punch-card{display:flex; flex-direction:column;}
.punch-status{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
}
.punch-count{font-size:32px; font-weight:700; color:var(--sky-500);}
.punch-label{font-size:12px; color:var(--text-soft);}
.punch-streak{font-size:12px; color:var(--sky-500); background:var(--sky-50); padding:4px 10px; border-radius:20px;}
.punch-btn{
  width:100%; padding:12px; border:none; border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--sky-300),var(--sky-400)); color:#fff;
  font-size:15px; font-weight:600; cursor:pointer; transition:all .25s; margin-top:auto;
}
.punch-btn:hover{transform:scale(1.02); box-shadow:0 4px 15px rgba(56,189,248,.3);}
.punch-btn.done{background:var(--sky-100); color:var(--sky-500); cursor:default;}
.punch-emoji{font-size:48px; text-align:center; margin:8px 0;}

/* 激励语卡片 */
.quote-card{
  background:linear-gradient(135deg,var(--rose-100),var(--sky-100));
  display:flex; flex-direction:column; justify-content:center;
}
.quote-icon{font-size:28px; margin-bottom:8px;}
.quote-cn{font-size:18px; font-weight:600; line-height:1.6; color:var(--text-main); margin-bottom:8px;}
.quote-en{font-size:13px; color:var(--text-soft); line-height:1.5; font-style:italic;}
.quote-refresh{
  margin-top:12px; font-size:12px; color:var(--sky-500); cursor:pointer;
  display:inline-flex; align-items:center; gap:4px; align-self:flex-start;
  transition:transform .3s;
}
.quote-refresh:hover{transform:rotate(180deg);}

/* === 内容区域 === */
.content-area{min-height:500px;}
.page{display:none; animation:fadeIn .4s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.page-header{
  display:flex; align-items:center; gap:12px; margin-bottom:20px;
}
.page-icon{font-size:32px;}
.page-title{font-size:24px; font-weight:700; color:var(--text-main);}
.page-desc{font-size:13px; color:var(--text-soft); margin-top:2px;}

/* 同步设置卡片 */
.sync-card{background:#fff; border-radius:16px; padding:24px; box-shadow:0 4px 16px rgba(56,189,248,.10); max-width:560px;}
.sync-title{font-size:18px; font-weight:700; color:var(--text-main); margin-bottom:10px;}
.sync-desc{font-size:14px; color:var(--text-soft); line-height:1.7; margin-bottom:18px;}
.sync-desc code{background:var(--sky-50); color:var(--sky-600); padding:2px 6px; border-radius:6px; font-size:13px;}
.sync-row{display:flex; gap:10px; margin-bottom:14px;}
.sync-input{flex:1; padding:11px 14px; border:1.5px solid var(--sky-200); border-radius:10px; font-size:14px; outline:none;}
.sync-input:focus{border-color:var(--sky-500);}
.sync-btn{background:var(--sky-500); color:#fff; border:none; border-radius:10px; padding:0 20px; font-size:14px; font-weight:600; cursor:pointer;}
.sync-btn:hover{background:var(--sky-600);}
.sync-status{font-size:13px; margin-bottom:12px; min-height:18px;}
.sync-tip{font-size:12px; color:var(--text-soft); line-height:1.6; background:var(--sky-50); border-radius:10px; padding:10px 12px;}
.sync-subtitle{font-size:13px; font-weight:600; color:var(--text-main); margin:14px 0 8px;}
.sync-subtitle:first-of-type{margin-top:4px;}

/* 统计行 */
.stats-row{display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.stat-mini{
  background:rgba(255,255,255,.8); border-radius:var(--radius-sm); padding:14px 20px;
  box-shadow:var(--shadow); border:1px solid rgba(191,219,254,.4); min-width:120px;
}
.stat-mini-value{font-size:24px; font-weight:700; color:var(--sky-500);}
.stat-mini-label{font-size:11px; color:var(--text-soft); margin-top:2px;}

/* 输入区 */
.input-box{
  display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;
}
.input-box input, .input-box textarea, .input-box select{
  flex:1; min-width:180px; padding:10px 14px; border:2px solid var(--sky-100);
  border-radius:var(--radius-sm); font-size:14px; color:var(--text-main); background:#fff;
  transition:border-color .25s; font-family:inherit;
}
.input-box input:focus, .input-box textarea:focus{outline:none; border-color:var(--sky-300);}
.input-box textarea{resize:vertical; min-height:60px;}
.btn-add{
  padding:10px 20px; background:linear-gradient(135deg,var(--sky-300),var(--sky-400));
  color:#fff; border:none; border-radius:var(--radius-sm); font-size:14px; font-weight:600;
  cursor:pointer; transition:all .25s; white-space:nowrap;
}
.btn-add:hover{transform:scale(1.03); box-shadow:0 4px 12px rgba(56,189,248,.25);}

/* 列表项 */
.list-item{
  display:flex; align-items:center; gap:12px; padding:14px 16px; background:rgba(255,255,255,.7);
  border-radius:var(--radius-sm); margin-bottom:8px; box-shadow:var(--shadow);
  border:1px solid rgba(191,219,254,.4); transition:all .25s;
}
.list-item:hover{transform:translateX(4px); border-color:var(--sky-200);}
.list-item.done{opacity:.6;}
.list-item.done .item-text{text-decoration:line-through; color:var(--text-light);}

.item-check{
  width:22px; height:22px; border:2px solid var(--sky-200); border-radius:50%;
  cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  transition:all .25s; font-size:13px;
}
.item-check.checked{background:var(--sky-400); border-color:var(--sky-400); color:#fff;}
.item-text{flex:1; font-size:14px; color:var(--text-main);}
.item-tag{
  font-size:11px; padding:3px 10px; border-radius:20px; background:var(--sky-50);
  color:var(--sky-500); white-space:nowrap;
}
.item-time{font-size:11px; color:var(--text-light); white-space:nowrap;}
.item-del{
  width:24px; height:24px; border:none; background:transparent; cursor:pointer;
  font-size:16px; color:var(--text-light); border-radius:50%; transition:all .25s;
}
.item-del:hover{background:var(--rose-100); color:var(--sky-500);}

.empty{
  text-align:center; padding:40px; color:var(--text-light); font-size:14px;
}
.empty-icon{font-size:48px; margin-bottom:8px; opacity:.5;}

/* 文案记录卡片 */
.copy-card{
  background:rgba(255,255,255,.85); border-radius:var(--radius-sm); padding:16px 18px;
  margin-bottom:12px; box-shadow:var(--shadow); border:1px solid rgba(191,219,254,.4);
  position:relative; transition:all .25s; border-left:4px solid var(--sky-400);
}
.copy-card:hover{transform:translateX(3px); box-shadow:var(--shadow-lg);}
.copy-card.fav{border-left-color:#fbbf24; background:linear-gradient(135deg,#fffbeb,#eff6ff);}
.copy-fav{
  position:absolute; top:12px; right:14px; border:none; background:transparent;
  font-size:20px; cursor:pointer; color:#fbbf24; transition:transform .2s; line-height:1;
}
.copy-fav:active{transform:scale(1.3);}
.copy-text{font-size:15px; line-height:1.7; color:var(--text-main); white-space:pre-wrap; padding-right:28px;}
.copy-src{font-size:12px; color:var(--sky-500); margin-top:8px; font-style:italic;}
.copy-foot{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
.copy-date{font-size:11px; color:var(--text-light);}

/* 复盘卡片 */
.review-card{
  background:rgba(255,255,255,.8); border-radius:var(--radius); padding:20px;
  margin-bottom:16px; box-shadow:var(--shadow); border:1px solid rgba(191,219,254,.4);
}
.review-label{font-size:13px; font-weight:600; color:var(--sky-500); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.review-textarea{
  width:100%; min-height:80px; padding:12px; border:2px solid var(--sky-100);
  border-radius:var(--radius-sm); font-size:14px; resize:vertical; font-family:inherit;
  color:var(--text-main); background:#fff;
}
.review-textarea:focus{outline:none; border-color:var(--sky-300);}
.review-save{
  margin-top:10px; padding:8px 18px; background:var(--sky-300); color:#fff;
  border:none; border-radius:var(--radius-sm); cursor:pointer; font-size:13px; font-weight:600;
  transition:all .25s;
}
.review-save:hover{background:var(--sky-400);}

/* 进度条 */
.progress-bar{
  width:100%; height:8px; background:var(--sky-50); border-radius:10px; overflow:hidden; margin-top:8px;
}
.progress-fill{
  height:100%; background:linear-gradient(90deg,var(--sky-300),var(--sky-500));
  border-radius:10px; transition:width .5s ease;
}

/* 每日词汇卡片 */
.daily-words{
  background:linear-gradient(135deg,var(--sky-50),var(--rose-100));
  border-radius:var(--radius); padding:16px 18px; margin-bottom:16px;
  border:1px solid rgba(191,219,254,.5); box-shadow:var(--shadow);
}
.daily-words-title{
  font-size:13px; font-weight:600; color:var(--sky-500); margin-bottom:12px;
  display:flex; align-items:center; gap:6px; justify-content:space-between;
}
.daily-words-refresh{
  font-size:12px; color:var(--sky-500); cursor:pointer; padding:2px 8px;
  border:1px solid var(--sky-200); border-radius:12px; transition:all .2s;
}
.daily-words-refresh:active{background:var(--sky-200);}
.dw-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; background:rgba(255,255,255,.7);
  border-radius:var(--radius-sm); margin-bottom:8px; border:1px solid rgba(191,219,254,.4);
}
.dw-word{font-size:15px; font-weight:700; color:var(--text-main); min-width:90px;}
.dw-phonetic{font-size:12px; color:var(--text-soft); font-style:italic; flex:1;}
.dw-mean{font-size:12px; color:var(--text-soft); margin-left:auto; max-width:40%;}
.dw-speak{
  width:30px; height:30px; border:none; background:var(--sky-100); border-radius:50%;
  font-size:14px; cursor:pointer; color:var(--sky-500); flex-shrink:0; transition:all .2s;
}
.dw-speak:active{transform:scale(.9); background:var(--sky-300); color:#fff;}

/* 卡路里统计条 */
.kcal-summary{
  background:linear-gradient(135deg,var(--sky-400),var(--sky-500)); color:#fff;
  border-radius:var(--radius); padding:16px 18px; margin-bottom:16px; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:space-between;
}
.kcal-summary .kcal-num{font-size:28px; font-weight:700;}
.kcal-summary .kcal-label{font-size:12px; opacity:.9; margin-top:2px;}
.kcal-summary .kcal-icon{font-size:36px; opacity:.85;}

/* 新闻获取 */
.news-fetch-bar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;
}
.btn-fetch{
  padding:12px 22px; background:linear-gradient(135deg,var(--sky-300),var(--sky-500));
  color:#fff; border:none; border-radius:var(--radius-sm); font-size:15px; font-weight:600;
  cursor:pointer; transition:all .25s; box-shadow:var(--shadow);
}
.btn-fetch:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
.btn-fetch:active{transform:scale(.97);}
.news-fetch-tip{font-size:12px; color:var(--text-soft);}
.today-news{margin-bottom:8px;}
.today-news-empty{
  text-align:center; padding:24px; color:var(--text-light); font-size:13px;
  background:rgba(255,255,255,.5); border-radius:var(--radius-sm); border:1px dashed var(--sky-200);
}
.tn-item{
  background:rgba(255,255,255,.8); border-radius:var(--radius-sm); padding:14px 16px;
  margin-bottom:10px; box-shadow:var(--shadow); border:1px solid rgba(191,219,254,.4);
  border-left:4px solid var(--sky-400);
}
.tn-head{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.tn-tag{
  font-size:11px; padding:2px 9px; border-radius:12px; font-weight:600; flex-shrink:0;
}
.tn-tag.domestic{background:var(--sky-50); color:var(--sky-600);}
.tn-tag.world{background:#e0f2fe; color:#0369a1;}
.tn-title{font-size:14px; font-weight:600; color:var(--text-main); line-height:1.4;}
.tn-summary{font-size:13px; color:var(--text-soft); line-height:1.6; margin-top:4px;}

/* 提示 */
.toast{
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(0);
  background:var(--sky-500); color:#fff; padding:12px 28px; border-radius:30px;
  font-size:14px; font-weight:500; box-shadow:0 4px 20px rgba(56,189,248,.3);
  z-index:9999; opacity:0; transition:all .35s ease;
}
.toast.show{transform:translateX(-50%) translateY(0); opacity:1;}

/* ============ 安装为 App 引导横幅 ============ */
.install-banner{
  position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(200px);
  width:min(92vw, 420px); background:rgba(255,255,255,.96); backdrop-filter:blur(16px);
  border:1px solid var(--sky-200); border-radius:18px; box-shadow:0 10px 40px rgba(56,189,248,.22);
  display:flex; align-items:center; gap:12px; padding:14px 16px; z-index:9998;
  opacity:0; transition:all .4s cubic-bezier(.32,.72,0,1);
}
.install-banner.show{transform:translateX(-50%) translateY(0); opacity:1;}
.install-icon{font-size:30px; flex-shrink:0;}
.install-text{flex:1; min-width:0;}
.install-title{font-size:14px; font-weight:700; color:var(--text-main);}
.install-sub{font-size:11px; color:var(--text-soft); margin-top:2px; line-height:1.4;}
.install-btn{
  flex-shrink:0; border:none; background:linear-gradient(135deg,var(--sky-300),var(--sky-400));
  color:#fff; font-size:13px; font-weight:600; padding:8px 16px; border-radius:12px; cursor:pointer;
  transition:all .2s;
}
.install-btn:hover{transform:scale(1.04); box-shadow:0 4px 12px rgba(56,189,248,.3);}
.install-close{
  flex-shrink:0; width:24px; height:24px; border:none; background:transparent; cursor:pointer;
  font-size:14px; color:var(--text-light); border-radius:50%;
}
.install-close:hover{background:var(--sky-50);}

/* ============ 每日播客 ============ */
.podcast-tags{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.podcast-tag{
  font-size:12px; padding:6px 14px; border-radius:20px; background:var(--sky-100);
  color:var(--sky-600); font-weight:500; border:1px solid var(--sky-200);
}

.podcast-player-card{
  background:linear-gradient(135deg,#1e293b 0%,#334155 100%);
  border-radius:var(--radius); padding:24px; margin-bottom:22px;
  color:#fff; box-shadow:0 10px 40px rgba(30,41,59,.35); position:relative; overflow:hidden;
}
.podcast-player-card::before{
  content:''; position:absolute; top:-40px; right:-40px; width:160px; height:160px;
  background:rgba(56,189,248,.12); border-radius:50%;
}
.podcast-player-card::after{
  content:''; position:absolute; bottom:-30px; left:-30px; width:120px; height:120px;
  background:rgba(125,211,252,.10); border-radius:50%;
}
.podcast-playing-badge{
  display:inline-block; font-size:12px; padding:4px 12px; border-radius:20px;
  background:rgba(56,189,248,.2); color:#7dd3fc; margin-bottom:16px; position:relative; z-index:1;
}
.podcast-cover{
  width:110px; height:110px; border-radius:var(--radius); background:var(--sky-400);
  display:flex; align-items:center; justify-content:center; font-size:52px; margin:0 auto 16px;
  position:relative; z-index:1; box-shadow:0 8px 30px rgba(0,0,0,.25);
}
.podcast-title{
  font-size:18px; font-weight:700; line-height:1.5; text-align:center; margin-bottom:8px;
  position:relative; z-index:1; padding:0 10px;
}
.podcast-host{
  font-size:13px; color:#94a3b8; text-align:center; margin-bottom:20px; position:relative; z-index:1;
}
.podcast-progress-wrap{position:relative; z-index:1; margin-bottom:10px;}
.podcast-progress{
  width:100%; height:6px; border-radius:10px; background:rgba(255,255,255,.15);
  -webkit-appearance:none; appearance:none; cursor:pointer; outline:none;
}
.podcast-progress::-webkit-slider-thumb{

// 根据日期种子生成当日词汇
function getDailyWords(list, count){
  var seed = parseInt(today().replace(/-/g,''), 10);
  var picks = [];
  for(var i=0;i<count;i++){
    picks.push(list[(seed + i*7) % list.length]);
  }
  return picks;
}

// localStorage 封装（兼容微信禁用 localStorage）
var _memoryStore = {};
const Store = {
  get(key, def){
    def = def === undefined ? [] : def;
    if(_memoryStore[key] !== undefined) return _memoryStore[key];
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch(e){ return def; }
  },
  set(key, val){
    _memoryStore[key] = val;
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
    SyncStore.schedulePush();
  },
  getObj(key, def){
    def = def === undefined ? {} : def;
    if(_memoryStore[key] !== undefined) return _memoryStore[key];
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch(e){ return def; }
  },
  setObj(key, val){ this.set(key, val); },
};

// ============ 云端实时同步(GitHub 仓库文件) ============
// token 由用户在「云端同步」页粘贴,只存浏览器 localStorage,不进代码仓库
const GH_CONFIG = {
  repo: 'hanbao772/hanbao-workbench-v2',
  enabled: true
};
const SYNC_LOCAL_KEY = 'cloud_sync_code';
const GH_TOKEN_KEY = 'cloud_gh_token';

const SyncStore = {
  code: '',
  ready: true,           // GitHub API 无需客户端初始化,直接可用
  _timer: null,
  _interval: null,
  _lastPull: 0,
  _lastPush: 0,
  _lastError: '',
  _lastRemoteStr: '',
  _sha: null,

  init(){
    this.code = localStorage.getItem(SYNC_LOCAL_KEY) || '';
    if(this.code && localStorage.getItem(GH_TOKEN_KEY)) this.start();
    this.renderStatus();
  },

  setToken(t){
    t = (t||'').trim();
    if(t) localStorage.setItem(GH_TOKEN_KEY, t); else localStorage.removeItem(GH_TOKEN_KEY);
    if(t && this.code) this.start();
    this.renderStatus();
  },

  // 输入同步码并开始同步
  setCode(code){
    code = (code || '').trim();
    this.code = code;
    if(code) localStorage.setItem(SYNC_LOCAL_KEY, code); else localStorage.removeItem(SYNC_LOCAL_KEY);
    if(code){
      this.start();
      this.pull().then(()=>this.pushNow());
    } else {
      this._lastError = '';
    }
    this.renderStatus();
  },

  start(){
    if(!this.code) return;
    this.pull();
    if(!this._interval){
      this._interval = setInterval(()=>this.pull(), 6000);
    }
  },

  // 收集所有需要同步的本地键
  collect(){
    const keys = [];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && (k.startsWith('data_') || k.startsWith('review_') || k==='data_podcast' || k==='punch' || k==='lastReset')) keys.push(k);
      }
    }catch(e){}
    const out = {};
    keys.forEach(k=>{ try{ out[k] = JSON.parse(localStorage.getItem(k)); }catch(e){ out[k] = localStorage.getItem(k); } });
    return out;
  },

  // 合并云端数据到本地
  applyRemote(data){
    if(!data) return;
    let changed = false;
    Object.keys(data).forEach(k=>{
      try{
        const local = localStorage.getItem(k);
        let val = data[k];
        if(typeof val === 'string'){ try{ val = JSON.parse(val); }catch(e){} }
        const incoming = JSON.stringify(val);
        if(local === null || local !== incoming){
          localStorage.setItem(k, incoming);
          _memoryStore[k] = val;
          changed = true;
        }
      }catch(e){}
    });
    if(changed){
      const active = document.querySelector('.page.active');
      const id = active ? active.id.replace('page_','') : '';
      if(id && id!=='sync'){ if(id==='review') renderReview(); else if(id==='podcast'){} else renderPage(id); }
      this.renderStatus();
    }
  },

  schedulePush(){
    if(!this.code) return;
    if(this._timer) clearTimeout(this._timer);
    this._timer = setTimeout(()=>this.pushNow(), 800);
  },

  async _api(method, path, body){
    const token = localStorage.getItem(GH_TOKEN_KEY) || '';
    if(!token){ throw new Error('未设置 GitHub Token'); }
    const url = 'https://api.github.com/repos/'+GH_CONFIG.repo+'/contents/'+path;
    const opt = { method, headers: {
      'Authorization': 'Bearer '+token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    }};
    if(body) opt.body = JSON.stringify(body);
    const res = await fetch(url, opt);
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.message || ('HTTP '+res.status));
    return data;
  },

  async pushNow(){
    if(!this.code) return;
    const payload = this.collect();
    const path = 'sync/'+encodeURIComponent(this.code)+'.json';
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    try{
      const body = { message: 'sync push '+this.code, content };
      if(this._sha) body.sha = this._sha;
      const data = await this._api('PUT', path, body);
      this._sha = data.content ? data.content.sha : this._sha;
      this._lastPush = Date.now();
      this._lastError = '';
      this.renderStatus();
    }catch(e){
      this._lastError = '推送失败: '+(e.message||e);
      console.warn('push failed', e);
      this.renderStatus();
    }
  },

  async pull(){
    if(!this.code) return;
    const path = 'sync/'+encodeURIComponent(this.code)+'.json';
    try{
      const data = await this._api('GET', path);
      this._sha = data.sha;
      // base64 -> UTF-8 正确解码(支持中文)
      const b64 = data.content ? data.content.replace(/\s/g,'') : '';
      const raw = b64 ? decodeURIComponent(escape(atob(b64))) : '';
      const obj = raw ? JSON.parse(raw) : null;
      if(obj){
        const remoteStr = JSON.stringify(obj);
        if(remoteStr !== this._lastRemoteStr){
          this._lastRemoteStr = remoteStr;
          this.applyRemote(obj);
        }
      }
      this._lastPull = Date.now();
      this._lastError = '';
      this.renderStatus();
    }catch(e){
      // 404 = 该同步码还没有数据,属正常
      if(e.message && e.message.indexOf('404') >= 0){
        this._lastPull = Date.now();
        this._lastError = '';
      } else {
        this._lastError = '拉取失败: '+(e.message||e);
      }
      console.warn('pull failed', e);
      this.renderStatus();
    }
  },

  renderStatus(){
    const el = $('syncStatus');
    if(!el) return;
    if(!GH_CONFIG.enabled){
      el.innerHTML = '<span style="color:#ef4444">⚠️ 未配置云端</span>';
      return;
    }
    if(!localStorage.getItem(GH_TOKEN_KEY)){
      el.innerHTML = '<span style="color:#f59e0b">🔑 请先填写 GitHub Token 再开启同步</span>';
      return;
    }
    if(!this.code){ el.innerHTML = '<span style="color:#f59e0b">🔑 Token 已就绪,请输入同步码开启同步</span>'; return; }
    if(this._lastError){ el.innerHTML = `<span style="color:#ef4444">❌ ${this._lastError}</span>`; return; }
    const pullAgo = this._lastPull ? Math.round((Date.now()-this._lastPull)/1000)+'秒前' : '尚未';
    const pushAgo = this._lastPush ? Math.round((Date.now()-this._lastPush)/1000)+'秒前' : '尚未';
    el.innerHTML = `<span style="color:#16a34a">✅ 同步中 · 拉取 ${pullAgo} · 推送 ${pushAgo} · 码:${this.code}</span>`;
  }
};

  const activeTab = document.querySelector('.mt-item.active');
  if(activeTab && activeTab.scrollIntoView) activeTab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  // 页面切换
  document.querySelectorAll('.page').forEach(function(el){ el.classList.remove('active'); });
  var page = document.getElementById('page_'+id);

}

function speakWord(lang, text){

        u.rate = 0.85;

      }
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } else {
      showToast('当前浏览器不支持语音朗读~');

// ============ 食物卡路里 ============
function guessFoodKcal(name, gram){
  gram = gram || 100;
  let base = FOOD_KCAL[name];
  if(base === undefined){
    // 模糊匹配：看名字是否包含库中的食物
    for(const key in FOOD_KCAL){
      if(name.indexOf(key) >= 0){ base = FOOD_KCAL[key]; break; }
    }
  }
  if(base === undefined) return null; // 未知食物，让用户手动输入
  return Math.round(base * gram / 100);
}

function addFood(id){
  const typeEl = $('inp_'+id+'_type');
  const wordEl = $('inp_'+id+'_word');
  const gramEl = $('inp_'+id+'_gram');

  if(!name){ showToast('请输入吃了什么~'); return; }
  let gram = gramEl ? parseInt(gramEl.value, 10) : NaN;
  if(!gram || gram <= 0) gram = 100;
  let kcal = guessFoodKcal(name, gram);
  let kcalText = '';
  if(kcal === null){

    kcal: kcal,

// ============ 运动消耗卡路里 ============
function addExercise(id){
  const wordEl = $('inp_'+id+'_word');
  const durEl = $('inp_'+id+'_duration');
  const wtEl = $('inp_'+id+'_weight');
  const name = wordEl ? wordEl.value.trim() : '';
  if(!name){ showToast('请输入运动项目~'); return; }
  const dur = durEl ? parseInt(durEl.value, 10) : NaN;
  if(!dur || dur <= 0){ showToast('请输入运动时长（分钟）~'); return; }
  const weight = wtEl ? parseFloat(wtEl.value) : NaN;
  const w = (weight && weight > 0) ? weight : 55;
  let rate = EXERCISE_KCAL[name];
  if(rate === undefined){
    for(const key in EXERCISE_KCAL){
      if(name.indexOf(key) >= 0){ rate = EXERCISE_KCAL[key]; break; }
    }
  }
  let kcal;
  if(rate === undefined){
    const input = prompt('未找到「'+name+'」的消耗数据，请手动输入本次消耗卡路里（kcal）：', '200');
    if(input === null) return;
    kcal = parseInt(input, 10);
    if(isNaN(kcal)) kcal = 0;
  } else {
    kcal = Math.round(rate * w * dur / 60);
  }
  const items = Store.get('data_'+id, []);
  items.push({
    text: name,
    mean: dur + '分钟 (' + kcal + 'kcal)',
    kcal: kcal,
    done:false,
    date: new Date().toTimeString().slice(0,5)
  });
  Store.set('data_'+id, items);
  if(wordEl) wordEl.value='';
  if(durEl) durEl.value='';
  renderPage(id);
  renderNav();
  showToast('已记录，消耗 '+kcal+' kcal 🏃');
}

// 自动从云端 news.json 拉取当日新闻，本地缓存，打开即更新
function renderTodayNews(){
  const box = $('todayNews');
  if(!box) return;
  const cached = Store.getObj('today_news', null);
  // 有缓存且是今天的，先立刻显示（避免空白等待）
  if(cached && cached.date === today() && cached.items && cached.items.length){
    drawNews(cached);
    // 仍在后台静默刷新，确保是最新
  } else {

  }

function drawNews(data){
  const box = $('todayNews');
  if(!box || !data || !data.items || !data.items.length){
    if(box) box.innerHTML = `<div class="today-news-empty">🌸 今日新闻稍后更新，点「刷新新闻」试试~</div>`;
    return;
  }
  box.innerHTML = `<div style="font-size:13px;font-weight:600;color:var(--sky-500);margin-bottom:10px;">📰 ${data.date} 国内外热点（${data.items.length}条）</div>` +
    data.items.map(function(n){
      const tagClass = n.type==='world' ? 'world' : 'domestic';
      const tagText = n.type==='world' ? '国际' : '国内';
      return `<div class="tn-item">
        <div class="tn-head">
          <span class="tn-tag ${tagClass}">${tagText}</span>
          <span class="tn-title">${n.title}</span>
        </div>
        <div class="tn-summary">${n.summary}</div>
      </div>`;
    }).join('');
}

function fetchNews(box, cached){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(function(){ ctrl.abort(); }, 8000); // 8秒超时
    fetch('news.json?t=' + Date.now(), {cache:'no-store', signal: ctrl.signal})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.json();
      })
      .then(function(data){
        clearTimeout(timer);
        if(data && data.date && data.items && data.items.length){
          Store.set('today_news', data);
          drawNews(data);
        } else if(box){
          box.innerHTML = `<div class="today-news-empty">🌸 今日新闻稍后更新，点「🔄 刷新新闻」试试~</div>`;
        }
      })
      .catch(function(err){
        clearTimeout(timer);
        // 超时或失败：保留本地缓存（若有），否则提示
        if(box && (!cached || cached.date !== today())){
          box.innerHTML = `<div class="today-news-empty">🌸 网络有点慢，已显示本地缓存～点「🔄 刷新新闻」可重试</div>`;
        }
      });
  }catch(e){
    if(box && (!cached || cached.date !== today())){
      box.innerHTML = `<div class="today-news-empty">🌸 加载失败，点「🔄 刷新新闻」重试~</div>`;
    }
  }
}

function getDailyPodcasts(items, count){
  // 日期种子随机打乱，每天固定一组推荐
  const seed = new Date().getFullYear()*1000 + new Date().getMonth()*40 + new Date().getDate();
  const arr = items.slice();
  let s = seed % 2147483647;
  for(let i = arr.length - 1; i > 0; i--){
    s = (s * 16807) % 2147483647;
    const j = s % (i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  // 优先 15 分钟左右的单集
  const short = arr.filter(function(p){ return p.duration >= 600 && p.duration <= 1200; });
  const pool = short.length >= count ? short : arr;
  return pool.slice(0, count);
}

// 「去听」按钮：在新标签页打开该集所属节目主页
function playPodcast(idx){
  if(!PODCAST_DATA || !PODCAST_DATA[idx]) return;
  const p = PODCAST_DATA[idx];
  selectPodcast(idx);
  if(p.audioUrl){
    window.open(p.audioUrl, '_blank', 'noopener');
  } else {
    showToast('暂无播放链接~');
  }
}

function prevPodcast(){
  if(!PODCAST_DATA || !PODCAST_DATA.length) return;
  const idx = (PODCAST_INDEX - 1 + PODCAST_DATA.length) % PODCAST_DATA.length;
  selectPodcast(idx);
}

function nextPodcast(){
  if(!PODCAST_DATA || !PODCAST_DATA.length) return;
  const idx = (PODCAST_INDEX + 1) % PODCAST_DATA.length;
  selectPodcast(idx);
}

// ============ 播客笔记功能 ============
function fillPodcastTag(tag){
  const el = $('pcQuickNote');
  if(el){
    el.value = (el.value ? el.value + ' ' : '') + '#' + tag + ' ';
    el.focus();
  }
}
function noteThisEpisode(title, host){
  const el = $('pcQuickNote');
  if(el){
    const prefix = el.value ? el.value.trim() + '\n' : '';
    el.value = prefix + '🎙️ ' + title + (host ? ' · ' + host : '') + '\n';
    el.focus();
  }
}
function savePodcastNote(){
  const el = $('pcQuickNote');
  const text = el ? el.value.trim() : '';
  if(!text){ showToast('先写点什么再记哦~'); return; }
  const items = Store.get('data_podcast', []);
  items.unshift({ text, mean:'', done:false, date: today() });
  Store.set('data_podcast', items);
  el.value = '';
  renderPodcastNotesList();
  showToast('播客笔记已保存 📝');
}
function deletePodcastNote(idx){
  const items = Store.get('data_podcast', []);
  if(idx >= 0 && idx < items.length){
    items.splice(idx, 1);
    Store.set('data_podcast', items);
    renderPodcastNotesList();
  }
}
function renderPodcastNotesList(){
  const items = Store.get('data_podcast', []);
  if(!items.length) return '<div class="today-news-empty">📝 还没有播客笔记，听了一期后写一句感想吧~</div>';
  return items.map(function(it, idx){
    return `<div class="list-item">
      <div class="item-text" style="white-space:pre-wrap;">${escapeHtml(it.text)}</div>
      <div class="item-actions">
        <button class="item-btn delete" onclick="deletePodcastNote(${idx})" title="删除">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function formatTime(sec){
  if(!sec || isNaN(sec)) return '00:00';
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = function(n){ return n < 10 ? '0'+n : n; };
  if(h > 0) return h + ':' + pad(m) + ':' + pad(s);
  return pad(m) + ':' + pad(s);
}

// ============ 时钟 ============
function updateClock(){
  const now = new Date();
  $('clock').textContent = now.toTimeString().slice(0,8);
  $('date').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  const weeks = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  $('weekday').textContent = weeks[now.getDay()];
}

// ============ 打卡 ============
function initPunch(){
  const punchData = Store.getObj('punch', {lastDate:'', streak:0, total:0});
  // 如果跨天了，重置今日状态
  if(punchData.lastDate !== today()){
    $('punchBtn').classList.remove('done');
    $('punchBtn').textContent = '🌷 今日打卡';
    $('punchStreak').textContent = '今日未打卡';
    $('punchEmoji').textContent = '🌼';
  } else {
    $('punchBtn').classList.add('done');
    $('punchBtn').textContent = '✅ 今日已打卡';
    $('punchStreak').textContent = '已连续 '+punchData.streak+' 天';
    $('punchEmoji').textContent = '🌸';
  }
  $('punchCount').textContent = punchData.streak;
}

function doPunch(){
  const punchData = Store.getObj('punch', {lastDate:'', streak:0, total:0});
  if(punchData.lastDate === today()){
    showToast('今天已经打过卡啦~');
    return;
  }
  // 计算连续天数
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(punchData.lastDate === yesterday){
    punchData.streak += 1;
  } else {
    punchData.streak = 1;
  }
  punchData.lastDate = today();
  punchData.total = (punchData.total||0) + 1;
  Store.set('punch', punchData);
  initPunch();
  showToast('打卡成功！连续 '+punchData.streak+' 天 🎉');
}

// ============ 每日激励语 ============
function getDailyQuote(){
  // 用日期作为种子，每天固定一句
  const seed = new Date().getFullYear()*1000 + new Date().getMonth()*40 + new Date().getDate();
  return QUOTES[seed % QUOTES.length];
}

function refreshQuote(){
  const q = QUOTES[Math.floor(Math.random()*QUOTES.length)];
  $('quoteCn').textContent = q.cn;
  $('quoteEn').textContent = q.en;
}

function initQuote(){
  const q = getDailyQuote();
  $('quoteCn').textContent = q.cn;
  $('quoteEn').textContent = q.en;
}

// ============ 每日重置检查 ============
function checkDailyReset(){
  const lastReset = Store.get('lastReset', '');
  if(lastReset !== today()){
    // 每日重置：清除"每日重置"类模块的当日数据（但保留累积记录）
    // 这里只标记，不自动删除，由各模块自行管理
    Store.set('lastReset', today());
  }
}

// ============ 初始化 ============
function init(){
  try{
    checkDailyReset();
    renderNav();
    renderAllPages();
    updateClock();
    setInterval(updateClock, 1000);
    initPunch();
    initQuote();
    SyncStore.init();   // 云端同步初始化
  }catch(e){
    // 初始化出错时至少显示时间
    updateClock();
    setInterval(updateClock, 1000);
  }
  // 从 URL 注入今日新闻（助手生成的分享链接带 ?news= 参数）
  try{
    var qs = location.search;
    var newsParam = '';
    var idx = qs.indexOf('news=');
    if(idx >= 0){
      newsParam = qs.substring(idx + 5).split('&')[0];
    }
    if(newsParam){
      var decoded = JSON.parse(decodeURIComponent(escape(atob(newsParam))));
      if(decoded && decoded.items && decoded.items.length){
        setTodayNews(decoded.items);
      }
      // 清理 URL，避免重复写入
      var cleanUrl = location.origin + location.pathname + location.hash;
      history.replaceState(null, '', cleanUrl);
    }
  }catch(e){}
  // 注册 Service Worker，支持「添加到主屏幕」与离线缓存（PWA / App 化）
  if('serviceWorker' in navigator){
    try{
      navigator.serviceWorker.register('sw.js').catch(function(err){ /* 注册失败不影响正常使用 */ });
    }catch(e){}
  }
  // 捕获浏览器「可安装」事件，展示安装引导
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    window.__deferredPrompt = e;
    showInstallBanner();
  });
  window.addEventListener('appinstalled', function(){ hideInstallBanner(); showToast('已安装，去主屏找「汉堡的万能助手」吧 🍔'); });
  // 阻止移动端双击缩放
  var lastTouch = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if(now - lastTouch < 300){ e.preventDefault(); }
    lastTouch = now;
  }, {passive:false});
  // 处理 URL hash 跳转（从快捷方式打开）
  if(location.hash === '#review') switchPage('review');
  if(location.hash === '#punch'){
    var punchBtn = document.getElementById('punchBtn');
    if(punchBtn && punchBtn.scrollIntoView) punchBtn.scrollIntoView({behavior:'smooth'});
  }
}
window.addEventListener('DOMContentLoaded', init);
</script>
