<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test V3</title>
<style>
body{font-family:sans-serif;background:#fce7f3;min-height:100vh;display:flex;align-items:center;justify-content:center;}

.big{font-size:48px;font-weight:700;color:#ec4899;}

</style>
</head>
<body>
<div class="box">
  <div class="big">✅ TEST V3</div>
  <div class="t">如果你看到这行字，说明手机能正常加载新页面</div>
  <div class="id" id="now"></div>
</div>
<script>
  document.getElementById('now').textContent = new Date().toLocaleString();
</script>
</body>
