<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>汉堡的万能助手（纯净版）</title>
<style>
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#0ea5e9;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#eff6ff;z-index:99999;}
  .spin{width:40px;height:40px;border:4px solid #bae6fd;border-top-color:#0ea5e9;border-radius:50%;animation:sp 0.9s linear infinite;margin-bottom:14px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  #err{padding:30px;text-align:center;color:#0369a1;line-height:1.8;font-family:sans-serif;}
</style>
</head>
<body>
<div id="loader"><div class="spin"></div><div id="loaderText">正在加载最新版…</div></div>
<script>
(function(){
  var sources = [
    {url:'./index.html', label:'同源'},
    {url:'https://cdn.jsdelivr.net/gh/hanbao772/hanbao-workbench-v2@main/index.html', label:'jsDelivr 镜像'},
    {url:'https://raw.githubusercontent.com/hanbao772/hanbao-workbench-v2/main/index.html', label:'GitHub Raw'}
  ];
  function setText(t){ var el=document.getElementById('loaderText'); if(el) el.textContent=t; }
  function fail(){
    var l=document.getElementById('loader'); if(l) l.innerHTML='<div id="err">所有镜像源都连不上<br>请检查网络或刷新重试</div>';
  }
  function tryOne(i){
    if(i>=sources.length){ fail(); return; }
    setText('正在从 ' + sources[i].label + ' 拉取…');
    fetch(sources[i].url + '?_=' + Date.now(), {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.text();
      })
      .then(inject)
      .catch(function(){ tryOne(i+1); });
  }
  function inject(html){
    setText('正在渲染…');
    document.open();
    document.write(html);
    document.close();
  }
  tryOne(0);
})();
</script>
</body>
</html>
